name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The tool is meant to run anywhere a developer does, so prove it rather
    # than assert it. The tests need no network and no T4 instance.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported, a middle version, and newest. 3.11 is the floor
        # because it is the oldest Python still getting security fixes --
        # 3.9 ended October 2025 and 3.10 October 2026. Every one of these
        # is available on every -latest runner, so nothing needs pinning.
        python: ["3.11", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Install the package
        run: python -m pip install .

      - name: CLI responds
        run: |
          t4 --version
          t4 --help

      - name: End-to-end project setup
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          t4 init
          t4 env add test https://myweb-test.example.edu
          t4 env add prod https://myweb.example.edu
          t4 env
          t4 token status
          test -f .t4/config.json
          # The repository tracks the source and nothing else, so the whole
          # of .t4 -- config, tokens, local logs -- must be ignored.
          grep -qx '.t4/' .gitignore
          grep -q 't4-source/\*/_raw/' .gitignore
          # Push must refuse an environment that is not explicitly writable.
          if t4 push --env prod; then
            echo "push should have refused a pull-only environment"; exit 1
          fi
          echo "ok"
