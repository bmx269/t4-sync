<text x="56" y="56" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#9fb4ff" text-anchor="start">TERMINAL FOUR</text>
<text x="56" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#e8eaf0" text-anchor="start">the CMS - where your templates live</text>
<text x="56" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#99a1b3" text-anchor="start">myweb-test.example.edu</text>
<rect x="510" y="30" width="330" height="92" rx="8" fill="#17281d" stroke="#8ff0a6" stroke-width="1.5"/>
<text x="526" y="56" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#8ff0a6" text-anchor="start">PUBLISHED SITE</text>
<text x="526" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#e8eaf0" text-anchor="start">the finished pages visitors see</text>
<text x="526" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#99a1b3" text-anchor="start">webtest.example.edu</text>
<line x1="120" y1="130" x2="120" y2="170" stroke="#9fb4ff" stroke-width="2" stroke-linecap="round"/>
<path d="M120 174 l-5 -9 l10 0 z" fill="#9fb4ff" transform="rotate(180 120 170)"/>
<text x="120" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9fb4ff" text-anchor="middle">t4 pull</text>
<text x="120" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="400" fill="#99a1b3" text-anchor="middle">bring templates down</text>
<line x1="292" y1="170" x2="292" y2="130" stroke="#9fb4ff" stroke-width="2" stroke-linecap="round"/>
<path d="M292 134 l-5 -9 l10 0 z" fill="#9fb4ff" transform="rotate(0 292 130)"/>
<text x="292" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#9fb4ff" text-anchor="middle">t4 push</text>
<text x="292" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="400" fill="#99a1b3" text-anchor="middle">send changes back</text>
<line x1="675" y1="130" x2="675" y2="170" stroke="#8ff0a6" stroke-width="2" stroke-linecap="round"/>
<path d="M675 174 l-5 -9 l10 0 z" fill="#8ff0a6" transform="rotate(180 675 170)"/>
<text x="675" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#8ff0a6" text-anchor="middle">t4 mirror</text>
<text x="675" y="200" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="400" fill="#99a1b3" text-anchor="middle">copy the pages (one way)</text>
<rect x="40" y="214" width="800" height="196" rx="8" fill="#191c24" stroke="#3b4455" stroke-width="2"/>
<text x="62" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#99a1b3" text-anchor="start">YOUR COMPUTER</text>
<rect x="62" y="260" width="360" height="60" rx="8" fill="#0d1017" stroke="#3b4455" stroke-width="1.5"/>
<text x="78" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#e8eaf0" text-anchor="start">t4-source/</text>
<text x="78" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#99a1b3" text-anchor="start">the templates - these are what you edit</text>
<rect x="458" y="260" width="360" height="60" rx="8" fill="#0d1017" stroke="#3b4455" stroke-width="1.5"/>
<text x="474" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#e8eaf0" text-anchor="start">site-mirror/</text>
<text x="474" y="304" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#99a1b3" text-anchor="start">a copy of the finished pages</text>
<rect x="62" y="336" width="756" height="56" rx="8" fill="#1d2440" stroke="#9fb4ff" stroke-width="1.5"/>
<text x="78" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="700" fill="#9fb4ff" text-anchor="start">t4 serve</text>
<text x="148" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#e8eaf0" text-anchor="start">http://127.0.0.1:8321</text>
<text x="78" y="380" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#99a1b3" text-anchor="start">the two combined: real pages, with your edits applied as you save</text>
</svg>
