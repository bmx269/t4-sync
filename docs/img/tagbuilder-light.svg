<text x="36" y="378" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" font-weight="400" fill="#5a6376" text-anchor="start">A layout is either Standard or Handlebars. T4 will not evaluate T4 tags inside a Handlebars layout, or Handlebars inside a Standard one.</text>
