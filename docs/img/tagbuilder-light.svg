<text x="36" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" font-weight="400" fill="#5a6376" text-anchor="start">Attributes come from the T4 tag reference; element names come from this project's own content types.</text>
<text x="36" y="80" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9.5" xml:space="preserve"><tspan fill="#1a1d25">The content type is not named in the tag. </tspan><tspan fill="#5a6376">A content tag names an element, and the tag already sits inside that type's Content Layout.</tspan></text>
