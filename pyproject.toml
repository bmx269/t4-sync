[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "t4-sync"
version = "0.1.0"
description = "T4 CMS Local Development Tool: pull Terminal Four layout source to disk, edit locally with live preview, review and push back."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Trent Stromkins" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []          # standard library only, on purpose

[project.scripts]
t4 = "t4sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
